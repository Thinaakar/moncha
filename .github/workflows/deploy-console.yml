# Deploys apps/console (Next.js via OpenNext) to the moncha-console Worker on Cloudflare.
# Needs the repo secret CLOUDFLARE_API_TOKEN (same token as the backend deploy). The console reaches the backend
# through the BACKEND service binding, so moncha-backend must be deployed first.
name: Deploy console (Cloudflare)

on:
  push:
    branches: [Backend]
    paths:
      - apps/console/**
      - packages/contracts/**
      - packages/config/**
      - pnpm-lock.yaml
      - .github/workflows/deploy-console.yml
  workflow_dispatch:

concurrency:
  group: deploy-console
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.token.outputs.ready }}
    steps:
      - id: token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Repo secret CLOUDFLARE_API_TOKEN is not set, so the console was not deployed."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: check
    if: needs.check.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile --filter "@moncha/console..."

      - name: Typecheck
        run: pnpm --filter @moncha/console typecheck

      - name: Build
        working-directory: apps/console
        run: pnpm cf:build

      - name: Deploy
        working-directory: apps/console
        run: pnpm cf:deploy

      - name: Health check
        run: |
          for i in $(seq 1 12); do
            if curl -fsS https://moncha-console.vinothjv4-tech.workers.dev/api/health; then exit 0; fi
            sleep 10
          done
          echo "::error::/api/health did not return 200 after the deploy"
          exit 1
